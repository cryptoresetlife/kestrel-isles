<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0d1b2a">
<title>Kestrel Isles — island bush-pilot flight game</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M8 1l1.5 6H15v2H9.5L9 13l2 1v1H5v-1l2-1-.5-4H1V7h5.5z%22 fill=%22%23ffc23a%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="./css/style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="world" aria-label="3D view of the Kestrel Isles"></canvas>
<canvas id="hud" aria-hidden="true"></canvas>
<div id="touch" class="hidden" aria-hidden="true">
  <div id="stick"><div id="stick-knob"></div></div>
  <div id="throttle-track"><div id="throttle-knob"></div><span>THR</span></div>
  <div id="touch-buttons">
    <button data-act="gear">GEAR</button>
    <button data-act="flaps">FLAPS</button>
    <button data-act="brake">BRAKE</button>
    <button data-act="drop">DROP</button>
    <button data-act="camera">CAM</button>
    <button data-act="pause">II</button>
  </div>
</div>
<div id="ui"></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
